# Serve the production build of THE LAST HEARTH.
# Copy dist/ to /var/www/last-hearth and include this server block.

server {
    listen 443 ssl http2;
    server_name last-hearth.example.com;

    root /var/www/last-hearth;
    index index.html;

    # ssl_certificate     /etc/letsencrypt/live/last-hearth.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/last-hearth.example.com/privkey.pem;

    gzip on;
    gzip_types text/html application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /assets/manifest.json {
        add_header Cache-Control "public, max-age=300";
        types { } default_type application/json;
    }
}
